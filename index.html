<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#090b10"
  >

  <title>007 Live Chart</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<div class="app">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header>

    <div class="brand">
      007
    </div>

    <div class="chart-header-status">

      <span class="live-dot"></span>

      LIVE CHART

    </div>


    <!-- PINE EDITOR -->

    <button
      id="pine-editor"
      class="pine-editor-button"
      type="button"
    >
      </> Pine Editor
    </button>


    <!-- FULLSCREEN -->

    <button
      id="chart-fullscreen"
      class="chart-fullscreen"
      type="button"
    >
      ⛶ Full Screen
    </button>

  </header>


  <!-- =====================================================
       MAIN CHART
  ====================================================== -->

  <main>

    <section
      id="terminal"
      class="chart-page"
    >

      <!-- =================================================
           CHART TOOLBAR
      ================================================== -->

      <div class="chart-toolbar">

        <div class="symbol-info">

          <strong id="market-symbol">
            EUR/USD
          </strong>

          <span id="market-status">
            ● LIVE
          </span>

        </div>


        <div class="chart-actions">

          <select id="symbol">

            <optgroup label="Forex">

              <option value="EUR/USD">
                EUR/USD
              </option>

              <option value="GBP/USD">
                GBP/USD
              </option>

              <option value="USD/JPY">
                USD/JPY
              </option>

              <option value="USD/CHF">
                USD/CHF
              </option>

              <option value="AUD/USD">
                AUD/USD
              </option>

              <option value="USD/CAD">
                USD/CAD
              </option>

            </optgroup>


            <optgroup label="Gold">

              <option value="XAU/USD">
                XAU/USD
              </option>

            </optgroup>


            <optgroup label="Crypto">

              <option value="BTC/USD">
                BTC/USD
              </option>

              <option value="ETH/USD">
                ETH/USD
              </option>

              <option value="SOL/USD">
                SOL/USD
              </option>

            </optgroup>

          </select>

        </div>

      </div>


      <!-- =================================================
           CHART
      ================================================== -->

      <div
        id="chart-screen"
        class="chart-screen"
      >

        <div class="chart-screen-header">

          <strong>
            007
          </strong>

          <span id="chart-current-symbol">
            EUR/USD
          </span>

        </div>


        <div class="tradingview-wrap">

          <div
            id="tradingview-widget"
            class="tradingview-container"
          ></div>

        </div>

      </div>

    </section>

  </main>

</div>


<script
  type="module"
  src="app.js"
></script>

</body>

</html>
